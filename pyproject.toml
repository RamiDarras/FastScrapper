[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "FastScrapper"
version = "0.1.0"
description = "Open-source web scraper with Cloudflare bypass, background polling, and REST API"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["scraper", "web-scraping", "cloudflare-bypass", "api"]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "nodriver>=0.37",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.0",
    "apscheduler>=3.10.0",
    "aiofiles>=24.1.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "black>=24.8.0",
    "ruff>=0.6.0",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
